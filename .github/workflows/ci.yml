name: state-store-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Tests
        run: npm test -- --runInBand
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build image
        run: docker build -t sky-state-store:${{ github.sha }} .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint id sky-state-store:${{ github.sha }} -u)" != "0"
